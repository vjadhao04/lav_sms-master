services:
  - type: web
    name: lav-sms
    env: php
    plan: free
    region: oregon
    buildCommand: |
      composer install --no-interaction --prefer-dist --no-progress --no-scripts
      npm install
      npm run production
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
      php artisan storage:link
    startCommand: |
      php artisan migrate --force
      php artisan serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://lav-sms.onrender.com
      - key: DB_CONNECTION
        value: mysql
